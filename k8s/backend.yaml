apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotel-backend
  template:
    metadata:
      labels:
        app: hotel-backend
    spec:
      imagePullSecrets:
        - name: hotel-registry
      containers:
        - name: backend
          image: hotel-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          env:
            - name: DB_HOST
              value: hotel-db
            - name: DB_NAME
              value: hotel_db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: hotel-db-credentials
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hotel-db-credentials
                  key: MYSQL_PASSWORD
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app: hotel-backend
